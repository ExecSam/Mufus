# HTML, CSS and JS are revalidated on every visit (so updates show up at once), images are cached for a day
map $uri $mufus_cache_control {
    ~*\.(?:png|ico)$  "public, max-age=86400";
    default           "no-cache";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/x-icon;

    add_header Cache-Control $mufus_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
